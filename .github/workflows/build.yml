name: Build Buddy Maze

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_STATUS: "stable"

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            out: build/windows/BuddyMaze.exe
            dir: build/windows
            artifact: BuddyMaze-windows
          - preset: "Linux"
            out: build/linux/BuddyMaze.x86_64
            dir: build/linux
            artifact: BuddyMaze-linux
          - preset: "Web"
            out: build/web/index.html
            dir: build/web
            artifact: BuddyMaze-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATES_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$(dirname "$TEMPLATES_DIR")"
          # barichello/godot-ci puts templates in /root
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}" ]; then
            ln -sf "/root/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}" "$TEMPLATES_DIR"
          fi
          echo "Templates dir contents:"
          ls "$TEMPLATES_DIR"/ 2>/dev/null | head -10 || echo "(empty or missing)"

      - name: Import project
        run: godot --headless --import 2>&1 | tail -3 || true

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "${{ matrix.dir }}"
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.out }}" 2>&1
          echo "--- output ---"
          ls -lh "${{ matrix.dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}

  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          TEMPLATES_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$(dirname "$TEMPLATES_DIR")"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}" ]; then
            ln -sf "/root/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}" "$TEMPLATES_DIR"
          fi

      - name: Android debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import project
        run: godot --headless --import 2>&1 | tail -3 || true

      - name: Export Android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/BuddyMaze.apk 2>&1 || \
            echo "Android export failed (may need SDK setup in container)"
          ls -lh build/android/ || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BuddyMaze-android
          path: build/android

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [export, export-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip builds
        run: |
          cd dist
          for d in */; do zip -r "${d%/}.zip" "$d"; done
          ls -lh *.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
